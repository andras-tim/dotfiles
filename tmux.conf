run-shell 'tmux setenv -g TMUX_VERSION $(tmux -V | sed -E "s>^tmux *([0-9]+)\..*$>\1>")'

# Redefine prefix
set -g prefix C-a
unbind C-b
bind C-a send-prefix

# Custom shortcuts
bind -n C-t new-window
bind -n C-PPage previous-window
bind -n C-NPage next-window
bind -n C-Right send M-f
bind -n C-Left send M-b

# Shell
set -g default-command 'zsh'

# Handy shortcuts
setw -g mode-keys vi
set -sg escape-time 0
set -s extended-keys on
set -g extended-keys-format xterm

# Configure proper terminal
set -g default-terminal 'tmux-256color'

# Alacritty: tmux only auto-detects xterm*/screen*/rxvt* by name, so alacritty
# gets none of these by default even though it actually supports all of them
set -ga terminal-features ',alacritty:clipboard:ccolour:cstyle:extkeys:focus:hyperlinks:mouse:RGB:strikethrough:sync:title:usstyle'

# Environment of the attaching client to refresh in the session
# SESSION_INPUT: keys (send-keys arguments, e.g. '"ssh host" Enter') typed into every new window and split
set -ga update-environment DISPLAY
set -ga update-environment WAYLAND_DISPLAY
set -ga update-environment DBUS_SESSION_BUS_ADDRESS
set -ga update-environment SESSION_INPUT

# Panel title and creation timestamp
# Creation-date stamps (slug/id style - frozen at creation)
set -g @pane_label '#{?#{||:#{==:#{pane_title},#{host}},#{==:#{pane_title},}},#{pane_current_command},#{pane_title}}'
set -g @pane_open_ts 'tmux set -p -t #{pane_id} @pcreated "$(date "+%Y%m%d-%H%M")"'
set -g @pane_send_input 'sleep 0.5 && tmux send-keys -t "#{pane_id}" #{E:SESSION_INPUT}'

set -g pane-border-format '| #[bold]#{E:@pane_label}#[default] |#[align=right]| #[bold]#{@pcreated}#[default] |──'
set -g pane-border-status top

# Status bar
# Pane title, or the running command while the title is unset or still the default hostname
setw -g automatic-rename on
set -g status-left '[#S:#I:#P]'  # Current window (i)ndex, (S)ession name, Current (p)ane index
set -g status-right '#[bold]#{E:@pane_label}#[default] | %Y-%m-%d (%a) %H:%M @#h'
set -g status-right-length 120

# Window title
set -g set-titles on
set -g set-titles-string '#{E:@pane_label} [#S:#I:#P]' # ..., Current (w)indow name, Current pane (t)itle

# Hooks
set-hook -g after-new-session {
    run-shell '#{E:@pane_open_ts}'
}
set-hook -g after-new-window {
    run-shell '#{E:@pane_open_ts}'
    if -F '#{SESSION_INPUT}' { run-shell -b '#{E:@pane_send_input}' }
}
set-hook -g after-split-window {
    run-shell '#{E:@pane_open_ts}'
    if -F '#{SESSION_INPUT}' { run-shell -b '#{E:@pane_send_input}' }
}

# Activity
set -g bell-action any
set -g visual-activity on
if-shell 'bash -c "(( $TMUX_VERSION >= 3 ))"' ' \
    set -g activity-action any; \
'

# Visual enhancements
if-shell 'bash -c "(( $TMUX_VERSION >= 3 ))"' ' \
    set -g pane-border-style fg=white; \
    set -g pane-active-border-style fg=green; \
    set -g status-style bg=black,fg=cyan; \
    setw -g window-status-style fg=green; \
    setw -g window-status-current-style fg=green,bold; \
'
if-shell 'bash -c "(( $TMUX_VERSION < 3 ))"' ' \
    set -g pane-border-fg white; \
    set -g pane-active-border-fg green; \
    set -g status-bg black; \
    set -g status-fg cyan; \
    setw -g window-status-fg green; \
    setw -g window-status-current-fg green; \
    setw -g window-status-current-attr bold; \
'

# Mouse
set -g mouse on
set -g set-clipboard on
set -g allow-passthrough on

# Others
set -g base-index 1
set -g history-limit 999999
