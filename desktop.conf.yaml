- defaults:
    link:
      relink: true
      create: true

- link:
    # GUI
    ~/.conkyrc: conkyrc.lua
    ~/.config/alacritty/alacritty.toml: alacritty/alacritty.toml
    ~/.vnc/config.d/Xvnc:
      force: true
      path: vnc/Xvnc
    ~/.config/openbox/autostart: openbox/autostart
    ~/.config/openbox/menu.xml: openbox/menu.xml
    ~/.config/openbox/rc.xml: openbox/rc.xml
    ~/.xbindkeysrc: xbindkeysrc
    ~/.Xdefaults: Xdefaults

    # Distro GUI - Xfce
    ~/.config/xfce4/xfconf/xfce-perchannel-xml/keyboard-layout.xml: xfce4/keyboard-layout.xml
    ~/.config/xfce4/xfconf/xfce-perchannel-xml/keyboards.xml: xfce4/keyboards.xml
    ~/.config/xfce4/xfconf/xfce-perchannel-xml/xfce4-keyboard-shortcuts.xml: xfce4/xfce4-keyboard-shortcuts.xml
    ~/.config/xfce4/xfconf/xfce-perchannel-xml/xfwm4.xml: xfce4/xfwm4.xml

    # Distro GUI - KDE
    ~/.config/ktrashrc: kde/ktrashrc
    ~/.config/dolphinrc: kde/dolphinrc
    ~/.config/discoverrc: kde/discoverrc
    ~/.config/plasma-org.kde.plasma.desktop-appletsrc: kde/plasma-org.kde.plasma.desktop-appletsrc
    ~/.config/kcminputrc: kde/kcminputrc
    ~/.Xresources: kde/Xresources
    # Generated by KDE from its own settings (theme, font, cursor). Its xsettingsd.conf and ~/.gtkrc-2.0 copies are not
    # linked: KDE replaces those files on save, which breaks a symlink.
    ~/.config/gtk-3.0/settings.ini: kde/gtk-3.0/settings.ini
    ~/.config/gtk-4.0/settings.ini: kde/gtk-4.0/settings.ini

- link:
    # Scripts
    ~/bin/control-spotify: bin/control-spotify
    ~/bin/gitgui-fixup.sh: bin/gitgui-fixup.sh
    ~/bin/gk: bin/gk
    ~/bin/monitor-config: bin/monitor-config
    ~/bin/set-bluetooth-audio: bin/set-bluetooth-audio
    ~/bin/set-pulse-volume: bin/set-pulse-volume
    ~/bin/st-tmux: bin/st-tmux

- shell:
    - command: [ "bin/check-requirements.sh alacritty xsel zenity", "Checking requirements" ]
      stderr: true
    - command: [ "bin/check-term-overrides.sh", "Checking configuration of terminal emulators" ]
      stdout: true
      stderr: true
    - command: [ "gsettings set org.gtk.Settings.FileChooser startup-mode cwd", "Change GTK's FileChooser startup mode to CWD" ]
      stderr: true
    # Skipped when no graphical session is running; openbox/autostart applies it at session start.
    # Plain xrdb replaces the resource database, so ~/.Xresources (loaded by SDDM) is merged back.
    - command: [ '[ -z "${DISPLAY}" ] || { xrdb ~/.Xdefaults && xrdb -merge ~/.Xresources; }', "Applying GUI config" ]
      stdout: true
      stderr: true
    # The flatpak runtime has no cursor themes; point sandboxes at the host ones.
    - command: [ '! command -v flatpak >/dev/null || flatpak override --user --env=XCURSOR_PATH=/run/host/user-share/icons:/run/host/share/icons', "Exposing host cursor themes to flatpaks" ]
      stderr: true
