# A git fetch or push now and then hangs after the connection is up: reuse one connection for 10 minutes, and give up
# on a silent one in about 30 seconds instead of waiting forever
Host github.com ssh.github.com
    ControlMaster auto
    ControlPath ~/.ssh/sockets/%r@%h:%p
    ControlPersist 10m
    ConnectTimeout 10
    ServerAliveInterval 15
    ServerAliveCountMax 2
