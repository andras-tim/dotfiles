- defaults:
    link:
      relink: true
      create: true

# Drop dead links into the dotfiles left behind by renamed or removed files
- clean: ['~', '~/bin']

- create:
    - ~/.ssh/sockets

- shell:
    - command: [ "rmdir ~/.config/git 2>/dev/null || true", "Removing empty directories" ]

- link:
    # Shell
    ~/.bash_profile: bash_profile
    ~/.bashrc: bashrc
    ~/.myrc: myrc
    ~/.oh-my-zsh: vendor/oh-my-zsh
    ~/.oh-my-zsh/custom/plugins/zsh-autocomplete: vendor/zsh-autocomplete
    ~/.oh-my-zsh/custom/plugins/zsh-autosuggestions: vendor/zsh-autosuggestions
    ~/.oh-my-zsh/custom/plugins/zsh-fzf-history-search: vendor/zsh-fzf-history-search
    ~/.zshrc: zshrc

    # VCS
    ~/.config/git: git
    ~/.hgrc: hgrc

    # Other console apps
    ~/.aria2/aria2.conf: aria2.conf
    ~/.config/htop/htoprc: htoprc
    ~/.config/mc/panels.ini:  # replaces an existing file: it holds only mc view settings, mc rewrites it on "Save setup"
      path: mc/panels.ini
      force: true
    ~/.gdbinit: gdbinit
    ~/.quiltrc: quiltrc
    ~/.screenrc: screenrc
    ~/.tmux.conf: tmux.conf
    ~/.vimrc: vimrc

- link:
    # Scripts
    ~/bin/gpg-without-tty: bin/gpg-without-tty
    ~/bin/nested-tmux-config: bin/nested-tmux-config
    ~/bin/setperf: bin/setperf
    ~/bin/setfacl-recursive: bin/setfacl-recursive
    ~/bin/sizetree: bin/sizetree
    ~/bin/tia-get-credentials: bin/tia-get-credentials
    ~/bin/tia-has-credentials: bin/tia-has-credentials
    ~/bin/tia-parallel: bin/tia_parallel/tia_parallel.py
    ~/bin/tssh: bin/tssh

# mc rewrites its ini on every exit, so set the key in place instead of linking the file
- shell:
    - command:
        - >-
          f=~/.config/mc/ini; mkdir -p ~/.config/mc;
          if grep -q '^permission_mode=' "$f" 2>/dev/null; then sed -i 's/^permission_mode=.*/permission_mode=true/' "$f";
          else printf '[Panels]\npermission_mode=true\n' >> "$f"; fi
        - "mc: highlighting the permissions"

- shell:
    - command: [ "bin/check-requirements.sh zsh tmux fzf", "Checking requirements" ]
      stderr: true
